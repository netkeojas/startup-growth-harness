<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">The Unplugged Christmas</title>
  <desc id="desc">48% of UK parents surveyed plan to buy fewer tech gifts this Christmas. Nuzzle: a soft toy, not a device.</desc>
  <rect width="1200" height="1200" fill="#F4F8F6"/>
  <!-- soft decorative shapes -->
  <circle cx="1060" cy="150" r="190" fill="#FFE9A9"/>
  <circle cx="120" cy="1090" r="160" fill="#FFD9CE"/>
  <!-- card -->
  <rect x="90" y="90" width="1020" height="1020" rx="48" fill="#FFFFFF" stroke="#D5E3E0" stroke-width="3"/>
  <!-- eyebrow -->
  <rect x="170" y="170" width="300" height="56" rx="28" fill="#0B5D68"/>
  <text x="320" y="207" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#FFFFFF">CHRISTMAS 2026</text>
  <text x="170" y="300" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#0F2A2E">An unplugged Christmas</text>
  <!-- headline stat -->
  <text x="160" y="560" font-family="Helvetica, Arial, sans-serif" font-size="280" font-weight="800" fill="#FF7D5C">48%</text>
  <text x="170" y="640" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#0F2A2E">of UK parents surveyed plan to buy</text>
  <text x="170" y="692" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#0F2A2E">fewer tech gifts this Christmas</text>
  <!-- divider -->
  <line x1="170" y1="760" x2="1030" y2="760" stroke="#D5E3E0" stroke-width="3"/>
  <!-- supporting stat -->
  <circle cx="196" cy="828" r="14" fill="#FFCF4D"/>
  <text x="230" y="840" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#4F6468"><tspan font-weight="700" fill="#083F47">85%</tspan> say making memories matters more</text>
  <text x="230" y="882" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#4F6468">than the latest tech</text>
  <!-- footer band -->
  <rect x="130" y="955" width="940" height="125" rx="28" fill="#083F47"/>
  <text x="170" y="1012" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Nuzzle <tspan font-weight="400" fill="#FFE9A9">· a soft toy, not a device</tspan></text>
  <text x="170" y="1052" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#D5E3E0">Source: survey of 2,000 UK parents, reported by Brit Brief, 12 Nov 2026</text>
</svg>
